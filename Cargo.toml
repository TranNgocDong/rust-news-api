[package]
name = "news-api-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
bcrypt = "0.19.3"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres","chrono"] }
tokio = { version = "1.53.2", features = ["full", "macros", "rt-multi-thread"] }
utoipa = { version = "6.0.0", features = ["chrono"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }